suite: test configmap
templates:
  - configmap.yaml
tests:
  - it: should create a configmap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pgstac-geoparquet-exporter-config

  - it: should have correct labels
    asserts:
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pgstac-geoparquet-exporter
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should add custom annotations
    set:
      annotations:
        custom-annotation: custom-value
        another-annotation: another-value
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: custom-value
      - equal:
          path: metadata.annotations["another-annotation"]
          value: another-value

  # main() reads exportAll, collections, settings and overrides at the top level
  - it: should render settings at the top level
    asserts:
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "(?m)^settings:\n  chunk_size: 8192\n  max_chunk_mb: 64\n  rewrite: true\n  statement_timeout: 3600000$"

  - it: should render overrides at the top level
    set:
      exportConfig:
        exportAll: true
        overrides:
          emdat-events:
            chunk_size: 500
            rewrite: false
    asserts:
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "(?m)^exportAll: true$"
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "(?m)^overrides:\n  emdat-events:\n    chunk_size: 500\n    rewrite: false$"

  - it: should pass collection entries through
    set:
      exportConfig:
        collections:
          - name: sentinel-2
            partition_frequency: YS
          - name: landsat
            complete_filename: baseline.parquet
            chunk_size: 1000
    asserts:
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "(?m)^collections:\n  - name: sentinel-2\n    partition_frequency: YS$"
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "complete_filename: baseline.parquet"
      - matchRegex:
          path: data["export-config.yaml"]
          pattern: "chunk_size: 1000"
