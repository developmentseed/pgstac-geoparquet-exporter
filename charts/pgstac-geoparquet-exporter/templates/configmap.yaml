apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgstac-geoparquet-exporter.fullname" . }}-config
  namespace: {{ include "pgstac-geoparquet-exporter.namespace" . }}
  labels:
    {{- include "pgstac-geoparquet-exporter.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Read by main(): exportAll, collections, settings, overrides
  export-config.yaml: |
    exportAll: {{ .Values.exportConfig.exportAll }}
    collections:
      {{- toYaml (.Values.exportConfig.collections | default list) | nindent 6 }}
    settings:
      {{- toYaml (.Values.exportConfig.settings | default dict) | nindent 6 }}
    overrides:
      {{- toYaml (.Values.exportConfig.overrides | default dict) | nindent 6 }}
