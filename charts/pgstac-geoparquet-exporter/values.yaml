# Default values for pgstac-geoparquet-exporter

image:
  repository: ghcr.io/developmentseed/pgstac-geoparquet-exporter
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

# STAC API URL for link injection (required)
# pgSTAC doesn't store links, so this URL is used to construct
# self, parent, collection, and root links for exported items.
stacApiUrl: ""  # e.g., "https://example.com/stac/v1"

# Export job configurations
jobs:
  complete:
    enabled: true
    schedule: "0 2 1 * *"  # Monthly
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

  incremental:
    enabled: true
    schedule: "0 3 * * *"  # Daily
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Common settings for all jobs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure

# PostgreSQL database configuration
database:
  existingSecret: "default-pguser-eoapi"
  secretKeys:
    host: host
    port: port
    database: dbname
    user: user
    password: password

# Object storage configuration
storage:
  # s3://bucket/path, abfs://container@account.dfs.core.windows.net/path, or a local path.
  # abfs:// authenticates via DefaultAzureCredential (e.g. workload identity).
  outputPath: "s3://some-bucket/geoparquet"
  existingSecret: ""
  secretKeys:
    accessKeyId: AWS_ACCESS_KEY_ID
    secretAccessKey: AWS_SECRET_ACCESS_KEY
  endpoint: ""
  region: ""

# Export configuration, rendered as-is into export-config.yaml.
# Per collection, values combine as: settings < overrides[name] < collections[] entry.
exportConfig:
  # Set to true to export all collections from the database
  # When true, collections list below is ignored
  exportAll: false

  # Collections to export when exportAll is false. Each entry takes a `name`
  # plus any key from `settings`, and optionally:
  #   partition_frequency: one file per pgSTAC partition instead of full.parquet
  #   complete_filename: complete-mode file name (default: full.parquet)
  #   incremental_dirname: incremental-mode directory (default: updates)
  collections: []
  # - name: my-collection
  #   rewrite: false

  # Defaults for every collection
  settings:
    # Max items per chunk
    chunk_size: 8192
    # Max approximate JSON size of a chunk (MB). Bounds memory for collections
    # with large geometries, whatever chunk_size is.
    max_chunk_mb: 64
    # Postgres statement timeout (milliseconds)
    statement_timeout: 3600000
    # Complete mode: replace an existing file. With false, a readable existing
    # file is kept; empty or unreadable files are always rewritten.
    rewrite: true

  # Per-collection settings, also applied with exportAll: true
  overrides: {}
  # Heavy-geometry collections (e.g. country polygons) can use smaller chunks:
  #   emdat-events:
  #     chunk_size: 500
  #   emdat-impacts:
  #     chunk_size: 500

# Additional configuration
labels: {}
annotations: {}

# ServiceAccount for export pods (e.g. one federated for Azure workload identity)
serviceAccountName: ""

# Extra labels on export pods only (e.g. azure.workload.identity/use: "true")
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
