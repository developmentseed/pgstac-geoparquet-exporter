version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Weekly, as the python base image carries the Debian fixes.
  - package-ecosystem: "docker"
    directory: "/"
    # Official python tags are often re-pushed within a week, and a digest-only
    # refresh waits out the cooldown: 7 days would skip most weekly runs.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # CI only tests Python 3.12, so moving off it is a deliberate upgrade
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      # Versioned images are only built on a release, so these commits are fixes.
      prefix: "fix(deps)"
